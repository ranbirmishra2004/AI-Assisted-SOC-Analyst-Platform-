services:
  web:
    build: .
    env_file:
      - .env
    environment:
      SOC_DB_PATH: /app/data/soc.db
      SOC_ENV: production
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - soc-data:/app/data
      - soc-reports:/app/reports
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    restart: unless-stopped

volumes:
  soc-data:
  soc-reports:
