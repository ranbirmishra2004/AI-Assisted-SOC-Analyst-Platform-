<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · SOC Analyst Platform</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main>
  <header class="page-header">
    <div>
      <p class="eyebrow">SECURE ACCESS</p>
      <h1>SOC Analyst Platform</h1>
      <p>Sign in with an account provisioned by your platform administrator.</p>
    </div>
  </header>
  <section class="card">
    <h2>Sign in</h2>
    {% if error %}<p role="alert">{{error}}</p>{% endif %}
    <form method="post" class="workflow-form">
      <input type="hidden" name="csrf_token" value="{{csrf_token}}">
      <input type="hidden" name="next" value="{{next_url}}">
      <label>Username
        <input name="username" autocomplete="username" maxlength="64" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Sign in</button>
    </form>
  </section>
</main>
</body>
</html>
