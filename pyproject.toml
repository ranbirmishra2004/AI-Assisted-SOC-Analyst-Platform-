[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-soc-analyst-platform"
version = "1.0.0"
description = "A local-first security operations workbench for log triage and incident tracking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "waitress>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools]
py-modules = ["analyzer", "app", "assessment", "database", "report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["venv", "data", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["analyzer", "app", "assessment", "database", "report"]

[tool.coverage.report]
show_missing = true
skip_covered = true
